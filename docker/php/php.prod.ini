memory_limit = 256M
max_execution_time = 60
upload_max_filesize = 64M
post_max_size = 64M
error_reporting = E_ALL & ~E_DEPRECATED & ~E_STRICT
display_errors = Off
display_startup_errors = Off
log_errors = On
error_log = /var/log/php/error.log
default_charset = "UTF-8"
date.timezone = UTC

[opcache]
opcache.enable=1
opcache.enable_cli=1
opcache.jit_buffer_size=100M
opcache.jit=1235
opcache.memory_consumption=256
opcache.max_accelerated_files=20000
opcache.validate_timestamps=0
opcache.revalidate_freq=0
opcache.interned_strings_buffer=16
opcache.fast_shutdown=1

[Session]
session.save_handler = redis
session.save_path = "tcp://redis:6379"
session.gc_maxlifetime = 1440
session.gc_probability = 1
session.gc_divisor = 100
session.cookie_secure = On
session.cookie_httponly = On
session.cookie_samesite = "Lax"
session.use_strict_mode = 1
session.sid_bits_per_character = 5
session.sid_length = 48
session.cache_limiter = nocache
session.use_only_cookies = 1

[Redis]
redis.arrays.names = ''
redis.arrays.hosts = ''
redis.arrays.previous = ''
redis.arrays.functions = ''
redis.arrays.index = ''
redis.arrays.autorehash = ''
redis.arrays.pconnect = ''
redis.arrays.retry_interval = ''
redis.pconnect.pooling_enabled = 1
redis.pconnect.connection_pooling_factor = 1.0
redis.pconnect.pool_pattern = ''
redis.backoff.algorithm = 1
redis.backoff.base = 2
redis.backoff.cap = 0.1 